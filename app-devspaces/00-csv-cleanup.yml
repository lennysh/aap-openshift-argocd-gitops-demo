---
apiVersion: batch/v1
kind: Job
metadata:
  name: csv-cleanup
  namespace: openshift-operators
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-weight: "1"
  labels:
    app.kubernetes.io/name: devspaces
    app.kubernetes.io/part-of: devspaces-argocd
    app.kubernetes.io/managed-by: argocd
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      containers:
        - name: cleanup
          image: registry.redhat.io/openshift4/ose-cli:v4.14
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Checking for orphaned DevSpaces resources to clean up..."
              
              # Find any DevSpaces CSV (use simple grep since jsonpath regex doesn't work reliably)
              CSV=$(oc get csv -n openshift-operators -o jsonpath='{.items[*].metadata.name}' 2>/dev/null | tr ' ' '\n' | grep "^devspacesoperator" | head -1 || true)
              
              # Find any DevSpaces Subscription
              SUBSCRIPTION=$(oc get subscription -n openshift-operators -o jsonpath='{.items[*].metadata.name}' 2>/dev/null | tr ' ' '\n' | grep "^devspaces$" | head -1 || true)
              
              # Also check by spec.name
              if [ -z "$SUBSCRIPTION" ]; then
                SUBSCRIPTION=$(oc get subscription -n openshift-operators -o jsonpath='{range .items[?(@.spec.name=="devspaces")]}{.metadata.name}{"\n"}{end}' 2>/dev/null | head -1 || true)
              fi
              
              # If nothing exists, nothing to clean up - exit immediately
              if [ -z "$CSV" ] && [ -z "$SUBSCRIPTION" ]; then
                echo "No existing DevSpaces CSV or Subscription found. Fresh install - nothing to clean up."
                exit 0
              fi
              
              # If both exist, check if they're properly linked - if so, nothing to clean up
              if [ -n "$CSV" ] && [ -n "$SUBSCRIPTION" ]; then
                # Check if CSV has ownerReference to the subscription
                OWNER=$(oc get csv "$CSV" -n openshift-operators -o jsonpath='{.metadata.ownerReferences[?(@.kind=="Subscription")].name}' 2>/dev/null || true)
                
                if [ -n "$OWNER" ] && [ "$OWNER" = "$SUBSCRIPTION" ]; then
                  # Check if subscription properly references the CSV
                  INSTALLED_CSV=$(oc get subscription "$SUBSCRIPTION" -n openshift-operators -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)
                  CURRENT_CSV=$(oc get subscription "$SUBSCRIPTION" -n openshift-operators -o jsonpath='{.status.currentCSV}' 2>/dev/null || true)
                  
                  if [ "$INSTALLED_CSV" = "$CSV" ] || [ "$CURRENT_CSV" = "$CSV" ]; then
                    echo "CSV $CSV and Subscription $SUBSCRIPTION are properly linked. No cleanup needed."
                    exit 0
                  fi
                fi
              fi
              
              echo "Found potentially orphaned resources - proceeding with cleanup..."
              
              # If both exist, check if they're properly linked
              if [ -n "$CSV" ] && [ -n "$SUBSCRIPTION" ]; then
                echo "Found CSV: $CSV and Subscription: $SUBSCRIPTION"
                
                # FIRST: Check if CSV has ownerReference - this is the definitive indicator
                OWNER=$(oc get csv "$CSV" -n openshift-operators -o jsonpath='{.metadata.ownerReferences[?(@.kind=="Subscription")].name}' 2>/dev/null || true)
                
                # If CSV has no ownerReference, it's ALWAYS orphaned - delete both
                if [ -z "$OWNER" ]; then
                  echo "CSV $CSV has no Subscription ownerReference. This is DEFINITELY orphaned."
                  echo "Deleting both CSV and Subscription to allow clean recreation..."
                  oc delete csv "$CSV" -n openshift-operators --ignore-not-found=true
                  oc delete subscription "$SUBSCRIPTION" -n openshift-operators --ignore-not-found=true
                  echo "Cleaned up orphaned CSV $CSV and subscription $SUBSCRIPTION"
                  exit 0
                fi
                
                # CSV has ownerReference - check if it matches the subscription
                if [ "$OWNER" != "$SUBSCRIPTION" ]; then
                  echo "CSV $CSV is owned by subscription $OWNER, but we found subscription $SUBSCRIPTION. This is a mismatch."
                  echo "Deleting both to allow clean recreation..."
                  oc delete csv "$CSV" -n openshift-operators --ignore-not-found=true
                  oc delete subscription "$SUBSCRIPTION" -n openshift-operators --ignore-not-found=true
                  echo "Cleaned up mismatched CSV $CSV and subscription $SUBSCRIPTION"
                  exit 0
                fi
                
                # CSV is owned by the subscription - verify subscription status
                INSTALLED_CSV=$(oc get subscription "$SUBSCRIPTION" -n openshift-operators -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)
                CURRENT_CSV=$(oc get subscription "$SUBSCRIPTION" -n openshift-operators -o jsonpath='{.status.currentCSV}' 2>/dev/null || true)
                
                if [ "$INSTALLED_CSV" = "$CSV" ] || [ "$CURRENT_CSV" = "$CSV" ]; then
                  echo "Subscription $SUBSCRIPTION and CSV $CSV are properly linked (ownerReference and status match). No cleanup needed."
                  exit 0
                else
                  echo "CSV $CSV is owned by subscription $SUBSCRIPTION, but subscription status doesn't reference it (installedCSV=$INSTALLED_CSV, currentCSV=$CURRENT_CSV)."
                  echo "This indicates orphaned state. Deleting both..."
                  oc delete csv "$CSV" -n openshift-operators --ignore-not-found=true
                  oc delete subscription "$SUBSCRIPTION" -n openshift-operators --ignore-not-found=true
                  echo "Cleaned up orphaned CSV $CSV and subscription $SUBSCRIPTION"
                  exit 0
                fi
              fi
              
              # If only CSV exists (orphaned)
              if [ -n "$CSV" ] && [ -z "$SUBSCRIPTION" ]; then
                echo "Found orphaned CSV $CSV with no subscription. Deleting..."
                oc delete csv "$CSV" -n openshift-operators --ignore-not-found=true
                echo "Deleted orphaned CSV: $CSV"
                exit 0
              fi
              
              # If only Subscription exists (orphaned)
              if [ -z "$CSV" ] && [ -n "$SUBSCRIPTION" ]; then
                INSTALLED_CSV=$(oc get subscription "$SUBSCRIPTION" -n openshift-operators -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)
                CURRENT_CSV=$(oc get subscription "$SUBSCRIPTION" -n openshift-operators -o jsonpath='{.status.currentCSV}' 2>/dev/null || true)
                
                if [ -z "$INSTALLED_CSV" ] && [ -z "$CURRENT_CSV" ]; then
                  echo "Found orphaned subscription $SUBSCRIPTION with no CSV references. Deleting..."
                  oc delete subscription "$SUBSCRIPTION" -n openshift-operators --ignore-not-found=true
                  echo "Deleted orphaned subscription: $SUBSCRIPTION"
                  exit 0
                else
                  echo "Subscription $SUBSCRIPTION references CSV $INSTALLED_CSV or $CURRENT_CSV, but CSV doesn't exist. This is an orphaned subscription."
                  oc delete subscription "$SUBSCRIPTION" -n openshift-operators --ignore-not-found=true
                  echo "Deleted orphaned subscription: $SUBSCRIPTION"
                  exit 0
                fi
              fi
              
              echo "Cleanup completed."
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
