kind: ServiceAccount
metadata:
  name: argocd-csv-cleanup
  namespace: openshift-operators
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-csv-cleanup
  namespace: openshift-operators
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
- apiGroups:
  - operators.coreos.com
  resources:
